# 每天叫醒一次後台並查一次資料庫（/health/db），避免 Supabase 免費專案因為 7 天沒有資料庫活動被自動暫停。
# 只叫醒一次，Render 免費方案一個月約多用 15 小時，不會和 K線研究室一起超過每月 750 小時的額度。
# 時間：每天台北 09:00（UTC 01:00）。GitHub 的排程可能延遲幾分鐘；
# repo 60 天沒有更新時 GitHub 會自動停用排程，需到 Actions 頁面重新啟用。
name: Keep Supabase database active

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health/db
        env:
          API_URL: https://wan-design-backend.onrender.com
        run: |
          # 休眠中的 Render 服務喚醒需要 30–60 秒，給足等待時間並重試；資料庫連不上會回 503 讓這次執行失敗（GitHub 會寄信通知）
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 "$API_URL/health/db"
          echo
