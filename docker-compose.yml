services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - uploads:/app/uploads
    env_file: ./backend/.env
    ports:
      - "8000:8000"

  storefront:
    build: ./frontend/storefront
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend/storefront:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build: ./frontend/admin
    command: npm run dev -- --host 0.0.0.0 --port 5174
    volumes:
      - ./frontend/admin:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
